name: Barkeeper

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Barkeeper/**'
      - '.github/workflows/barkeeper.yml'
  push:
    branches: [main]
    paths:
      - 'Barkeeper/**'
      - '.github/workflows/barkeeper.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: Barkeeper/build.sh
      - name: Download-Link aktualisieren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view barkeeper >/dev/null 2>&1 || gh release create barkeeper --target "$GITHUB_SHA" --latest=false \
            --title "Barkeeper – aktuelle Version" \
            --notes "Download: Barkeeper.zip unten bei Assets. Entpacken und Barkeeper.app in den Ordner Programme ziehen.

          Beim ersten Öffnen meldet macOS, dass die App nicht geprüft werden kann. Dann: Systemeinstellungen → Datenschutz & Sicherheit → ganz unten „Dennoch öffnen“. Alternativ im Terminal: xattr -dr com.apple.quarantine /Applications/Barkeeper.app

          Voraussetzung: macOS 13 (Ventura) oder neuer. Keine besonderen Berechtigungen nötig."
          gh release upload barkeeper Barkeeper/build/Barkeeper.zip --clobber
